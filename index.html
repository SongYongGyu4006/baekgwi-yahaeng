<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백귀야행</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: fixed; left: 50%; top: 50%;
    width: 1280px; height: 720px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: #000;
  }
  #game { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  #titlebg {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }
  #titletext { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; }
  #starttext { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; }
  #helptext { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="titletext" aria-hidden="true">백귀야행</div>
  <div id="starttext" aria-hidden="true">시작: Enter</div>
  <div id="helptext" aria-hidden="true">조작: 이동 WASD/방향키 · 선택 1/2/3 · 일시정지 P · 소리 M</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
